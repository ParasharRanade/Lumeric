<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 380" width="450" height="380">
  <defs>
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="bodeFillA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="450" height="380" fill="url(#bgGradA)" rx="8" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title Header -->
  <rect x="15" y="14" width="420" height="28" fill="#0f172a" rx="4" stroke="#334155"/>
  <text x="225" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">Figure 1 (Panel A): Magnitude Response |H(jω)| (dB)</text>

  <!-- Grid lines -->
  <line x1="60" y1="65" x2="410" y2="65" stroke="#1e293b" stroke-width="1"/>
  <line x1="60" y1="120" x2="410" y2="120" stroke="#1e293b" stroke-width="1"/>
  <line x1="60" y1="175" x2="410" y2="175" stroke="#1e293b" stroke-width="1"/>
  <line x1="60" y1="230" x2="410" y2="230" stroke="#1e293b" stroke-width="1"/>
  <line x1="60" y1="285" x2="410" y2="285" stroke="#1e293b" stroke-width="1"/>

  <!-- -3dB Reference Line -->
  <line x1="60" y1="88" x2="410" y2="88" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="415" y="92" font-family="monospace" font-size="10" fill="#f59e0b">-3 dB</text>

  <!-- Vertical frequency grid (1k, 5k, 10k, 22.4k, 50k, 100k) -->
  <line x1="60" y1="60" x2="60" y2="300" stroke="#1e293b" stroke-width="1"/>
  <line x1="140" y1="60" x2="140" y2="300" stroke="#1e293b" stroke-width="1"/>
  <line x1="210" y1="60" x2="210" y2="300" stroke="#1e293b" stroke-width="1"/>
  <line x1="260" y1="60" x2="260" y2="300" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="330" y1="60" x2="330" y2="300" stroke="#1e293b" stroke-width="1"/>
  <line x1="410" y1="60" x2="410" y2="300" stroke="#1e293b" stroke-width="1"/>

  <!-- Axes -->
  <line x1="60" y1="300" x2="420" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="60" y1="55" x2="60" y2="300" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Y-Ticks (dB) -->
  <text x="52" y="69" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="end">0</text>
  <text x="52" y="124" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">-10</text>
  <text x="52" y="179" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">-20</text>
  <text x="52" y="234" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">-30</text>
  <text x="52" y="289" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">-40</text>
  <text x="18" y="180" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 18 180)">Gain |H(jω)| (dB)</text>

  <!-- X-Ticks (Frequency) -->
  <text x="60" y="318" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">1k</text>
  <text x="140" y="318" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">5k</text>
  <text x="210" y="318" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">10k</text>
  <text x="260" y="318" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">22.4k</text>
  <text x="330" y="318" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">50k</text>
  <text x="410" y="318" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">100k</text>
  <text x="235" y="340" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Frequency f (Hz, log scale)</text>

  <!-- Resonant Magnitude Curve -->
  <path d="M 60 295 C 130 280 200 240 235 150 C 245 110 255 65 260 65 C 265 65 275 110 285 150 C 320 240 360 280 410 295 L 410 300 L 60 300 Z" fill="url(#bodeFillA)"/>
  <path d="M 60 295 C 130 280 200 240 235 150 C 245 110 255 65 260 65 C 265 65 275 110 285 150 C 320 240 360 280 410 295" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Resonant Peak Marker -->
  <circle cx="260" cy="65" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="260" y="54" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">f₀ = 22.4 kHz (0 dB)</text>

  <!-- -3 dB Markers -->
  <circle cx="242" cy="88" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
  <text x="225" y="82" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="end">f₁ = 20.7 kHz</text>

  <circle cx="278" cy="88" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
  <text x="292" y="82" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="start">f₂ = 24.1 kHz</text>

  <text x="235" y="364" font-family="sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Bandwidth Δf = f₂ - f₁ = 3.4 kHz &bull; Q = f₀ / Δf</text>
</svg>
