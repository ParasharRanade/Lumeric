<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 380" width="450" height="380">
  <defs>
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="phaseFillB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="450" height="380" fill="url(#bgGradB)" rx="8" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title Header -->
  <rect x="15" y="14" width="420" height="28" fill="#0f172a" rx="4" stroke="#334155"/>
  <text x="225" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#a855f7" text-anchor="middle">Figure 2 (Panel B): Phase Response ∠H(jω) (deg)</text>

  <!-- Grid lines -->
  <line x1="60" y1="85" x2="410" y2="85" stroke="#1e293b" stroke-width="1"/>
  <line x1="60" y1="138" x2="410" y2="138" stroke="#1e293b" stroke-width="1"/>
  <line x1="60" y1="190" x2="410" y2="190" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="60" y1="242" x2="410" y2="242" stroke="#1e293b" stroke-width="1"/>
  <line x1="60" y1="295" x2="410" y2="295" stroke="#1e293b" stroke-width="1"/>

  <!-- Vertical frequency grid -->
  <line x1="60" y1="60" x2="60" y2="300" stroke="#1e293b" stroke-width="1"/>
  <line x1="140" y1="60" x2="140" y2="300" stroke="#1e293b" stroke-width="1"/>
  <line x1="210" y1="60" x2="210" y2="300" stroke="#1e293b" stroke-width="1"/>
  <line x1="260" y1="60" x2="260" y2="300" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="330" y1="60" x2="330" y2="300" stroke="#1e293b" stroke-width="1"/>
  <line x1="410" y1="60" x2="410" y2="300" stroke="#1e293b" stroke-width="1"/>

  <!-- Axes -->
  <line x1="60" y1="300" x2="420" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="60" y1="55" x2="60" y2="300" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Y-Ticks (Phase Degrees) -->
  <text x="52" y="89" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">+90°</text>
  <text x="52" y="142" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">+45°</text>
  <text x="52" y="194" font-family="monospace" font-size="10" font-weight="bold" fill="#a855f7" text-anchor="end">0°</text>
  <text x="52" y="246" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">-45°</text>
  <text x="52" y="299" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">-90°</text>
  <text x="18" y="180" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 18 180)">Phase ∠H (deg)</text>

  <!-- X-Ticks (Frequency) -->
  <text x="60" y="318" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">1k</text>
  <text x="140" y="318" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">5k</text>
  <text x="210" y="318" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">10k</text>
  <text x="260" y="318" font-family="monospace" font-size="10" font-weight="bold" fill="#a855f7" text-anchor="middle">22.4k</text>
  <text x="330" y="318" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">50k</text>
  <text x="410" y="318" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">100k</text>
  <text x="235" y="340" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Frequency f (Hz, log scale)</text>

  <!-- S-shaped Phase Curve -->
  <path d="M 60 88 C 170 90 220 130 260 190 C 300 250 350 290 410 295 L 410 300 L 60 300 Z" fill="url(#phaseFillB)"/>
  <path d="M 60 88 C 170 90 220 130 260 190 C 300 250 350 290 410 295" fill="none" stroke="#a855f7" stroke-width="2.5"/>

  <!-- Zero Crossing Marker -->
  <circle cx="260" cy="190" r="4.5" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="270" y="184" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#a855f7">Phase = 0° at f₀ = 22.4 kHz</text>

  <text x="235" y="364" font-family="sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Zero-phase crossing confirms pure resistive resonance</text>
</svg>
